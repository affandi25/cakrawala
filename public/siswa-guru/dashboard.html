<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Anggota | CAKRAWALA Digital Library</title>

  <!-- Tailwind CSS CDN & Custom Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#000C4F',
            'navy-light': '#0a1a7a',
            'navy-dark': '#000836'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.04)',
            'xs': '0 1px 3px 0 rgba(0, 0, 0, 0.07), 0 1px 2px 0 rgba(0, 0, 0, 0.04)'
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- JsBarcode Library (Code 128 / 1D Barcode) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <!-- Stylesheet Khusus Dashboard Siswa & Guru -->
  <link rel="stylesheet" href="../assets/css/dashboard-siswa-guru.css" />
</head>

<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col md:flex-row selection:bg-navy selection:text-white">

  <!-- Navigasi Sidebar & Header Mobile -->
  <include src="./components/sidebar.html" />

  <!-- Area Utama (Main Viewport) -->
  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">

    <!-- Header Atas: Breadcrumb & Judul Halaman -->
    <include src="./components/header.html" />

    <!-- Konten Utama Dashboard -->
    <main class="flex-1 p-5 sm:p-7 max-w-7xl w-full mx-auto space-y-6">
      <!-- Peringatan Denda Belum Lunas -->
      <include src="./components/banner-denda.html" />

      <!-- Tab 1: Beranda / Overview -->
      <include src="./components/tab-beranda.html" />

      <!-- Tab 2: Katalog Koleksi & Pra-Pinjam -->
      <include src="./components/tab-katalog.html" />

      <!-- Tab 3: Peminjaman Saya (Buku Aktif & Antrean) -->
      <include src="./components/tab-pinjaman.html" />

      <!-- Tab 4: Riwayat Pengembalian & Catatan Denda -->
      <include src="./components/tab-riwayat.html" />

      <!-- Tab 5: Kartu Anggota Digital & Pengaturan Profil -->
      <include src="./components/tab-profil.html" />
    </main>
  </div>

  <!-- Dialog Modals & Pop-ups -->
  <include src="./components/modals.html" />

  <!-- Wadah Toast Notifikasi -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full" aria-live="polite"></div>

  <!-- Scripts Koneksi & Logika Utama -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../assets/js/supabaseClient.js"></script>
  <script type="module" src="siswa-guru.js"></script>
</body>

</html>
