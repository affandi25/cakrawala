<!-- TAB 2: KATALOG BUKU & PRA-PINJAM -->
<section id="tabContentKatalog" class="hidden space-y-6">
  <!-- Bilah Filter & Pencarian -->
  <div class="rounded-2xl border border-slate-200/80 bg-white p-4 sm:p-5 shadow-2xs">
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3.5">
      <!-- Input Pencarian -->
      <div class="sm:col-span-6 relative">
        <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
        <input id="inputSearchKatalog" type="text" placeholder="Cari judul buku, penulis, penerbit, nomor rak..."
          class="w-full pl-10 pr-9 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:border-navy focus:ring-4 focus:ring-blue-100 transition" />
        <button id="btnClearSearchKatalog" type="button" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
          <i class="ph ph-x text-sm"></i>
        </button>
      </div>

      <!-- Filter Kategori -->
      <div class="sm:col-span-3">
        <select id="selectFilterKategoriKatalog"
          class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-navy focus:ring-4 focus:ring-blue-100 bg-white font-medium text-slate-700">
          <option value="">Semua Kategori</option>
        </select>
      </div>

      <!-- Filter Ketersediaan Stok -->
      <div class="sm:col-span-3">
        <select id="selectFilterStokKatalog"
          class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-navy focus:ring-4 focus:ring-blue-100 bg-white font-medium text-slate-700">
          <option value="">Semua Status Stok</option>
          <option value="tersedia">Hanya Tersedia (Bisa Dipinjam)</option>
          <option value="dipinjam">Sedang Dipinjam Habis</option>
        </select>
      </div>
    </div>

    <!-- Keterangan Jumlah Data -->
    <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <span id="katalogTableInfo">Menampilkan koleksi buku perpustakaan.</span>
      <span id="katalogRecordCount" class="font-bold text-navy">0 Koleksi</span>
    </div>
  </div>

  <!-- Grid Kartu Buku Katalog -->
  <div id="gridKatalogBuku" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">
    <!-- Kartu buku diinjeksi via JavaScript -->
  </div>
</section>
