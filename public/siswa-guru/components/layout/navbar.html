<!-- ==================== HEADER MOBILE ==================== -->
<header class="md:hidden flex items-center justify-between bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-2xs">
  <div class="flex items-center gap-2.5">
    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-navy text-white shadow-xs">
      <i class="ph ph-books text-xl"></i>
    </div>
    <div>
      <span class="text-base font-extrabold tracking-tight text-navy">CAKRAWALA</span>
      <span class="block text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Portal Anggota</span>
    </div>
  </div>
  <button id="btnToggleMobileSidebar" type="button" aria-label="Buka menu navigasi"
    class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-navy focus:outline-none">
    <i class="ph ph-list text-2xl"></i>
  </button>
</header>

<!-- Mobile Sidebar Backdrop Overlay -->
<div id="sidebarBackdrop" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs hidden md:hidden transition-opacity duration-300"></div>

<!-- ==================== SIDEBAR NAVIGASI ==================== -->
<aside id="memberSidebar"
  class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 flex flex-col justify-between transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out h-full md:h-screen shrink-0 overflow-y-auto">
  
  <!-- Bagian Atas: Logo & Menu -->
  <div class="flex flex-col h-full overflow-y-auto">
    <!-- Profil Pengguna (Siswa / Guru) di Bagian Atas Sidebar -->
    <div class="p-4 border-b border-slate-100 flex items-center justify-between gap-2.5 bg-slate-50/50">
      <button type="button" id="btnSidebarUserProfile" onclick="if(window.switchTab) window.switchTab('profil')"
        class="flex items-center gap-3 min-w-0 flex-1 text-left rounded-xl p-1 -m-1 hover:bg-white hover:shadow-2xs transition-all duration-200 group"
        title="Klik untuk membuka Pengaturan Profil">
      <div class="relative shrink-0">
        <div id="memberAvatarInitials" class="flex h-11 w-11 items-center justify-center rounded-xl bg-slate-300 text-white shadow-xs overflow-hidden">
          <i class="ph-fill ph-user text-2xl text-white"></i>
        </div>
        <span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full bg-emerald-500 border-2 border-white" title="Status: Online"></span>
      </div>
      <div class="min-w-0 flex-1">
        <p id="memberUserName" class="text-xs font-bold text-slate-800 truncate group-hover:text-navy transition">Memuat...</p>
        <p id="memberUserSub" class="text-[10px] font-medium text-slate-500 truncate mt-0.5">-</p>
      </div>
      </button>
      <button id="btnCloseMobileSidebar" type="button" aria-label="Tutup menu navigasi"
        class="md:hidden flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700">
        <i class="ph ph-x text-xl"></i>
      </button>
    </div>

    <!-- Menu Navigasi Tab -->
    <nav class="p-3.5 space-y-1.5 flex-1" aria-label="Navigasi Utama">
      <!-- 1. Beranda -->
      <button id="tabBtnBeranda" type="button"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 bg-navy text-white shadow-sm shadow-navy/20">
        <i class="ph ph-house text-xl shrink-0"></i>
        <span class="flex-1 text-left">Beranda</span>
      </button>

      <!-- 2. Katalog Koleksi -->
      <button id="tabBtnKatalog" type="button"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-books text-xl shrink-0"></i>
        <span class="flex-1 text-left">Katalog Koleksi</span>
      </button>

      <!-- 3. Peminjaman Saya -->
      <button id="tabBtnPinjaman" type="button"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-bookmark-simple text-xl shrink-0"></i>
        <span class="flex-1 text-left">Peminjaman Saya</span>
        <span id="badgeSidebarActiveCount" class="hidden rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600">0</span>
      </button>

      <!-- 4. Riwayat & Denda -->
      <button id="tabBtnRiwayat" type="button"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-clock-counter-clockwise text-xl shrink-0"></i>
        <span class="flex-1 text-left">Riwayat & Denda</span>
      </button>

      <!-- 5. Kartu Anggota Digital -->
      <button id="tabBtnProfil" type="button"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-identification-card text-xl shrink-0"></i>
        <span class="flex-1 text-left">Kartu Anggota & Profil</span>
      </button>

      <!-- Pintasan Katalog Publik Luar -->
      <div class="pt-4 mt-4 border-t border-slate-100">
        <a href="../index.html"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-slate-500 hover:bg-slate-100 hover:text-navy transition">
          <i class="ph ph-arrow-square-out text-lg"></i>
          <span>Katalog Publik Perpustakaan</span>
        </a>
      </div>
    </nav>
  </div>

  <!-- Bagian Bawah Sidebar: Tombol Log Out -->
  <div class="p-3.5 border-t border-slate-200 bg-slate-50/70">
    <button id="btnLogout" type="button"
      class="group flex w-full items-center justify-center gap-2.5 rounded-xl px-4 py-2.5 text-xs font-bold text-rose-600 bg-white border border-rose-200/80 shadow-2xs hover:bg-rose-50 hover:border-rose-300 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-rose-400">
      <i class="ph ph-sign-out text-lg transition-transform group-hover:-translate-x-0.5" aria-hidden="true"></i>
      <span>Keluar dari Akun</span>
    </button>
  </div>
</aside>
