<!-- 1. MODAL DETAIL LENGKAP BUKU -->
<div id="modalBookDetail" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs hidden opacity-0 transition-opacity duration-200" role="dialog" aria-modal="true">
  <div id="modalBookDetailContent" class="w-full max-w-lg rounded-3xl bg-white shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200 border border-slate-200">
    <div class="p-6">
      <div class="flex items-start justify-between border-b border-slate-100 pb-4 mb-4">
        <div class="flex items-center gap-2.5">
          <span class="rounded-full bg-blue-100 text-navy px-2.5 py-0.5 text-xs font-bold font-mono" id="detailBookId">BK-000</span>
          <span class="rounded-full bg-slate-100 text-slate-600 px-2.5 py-0.5 text-xs font-semibold" id="detailBookCategory">Kategori</span>
        </div>
        <button id="btnCloseDetailModal" type="button" class="text-slate-400 hover:text-slate-700">
          <i class="ph ph-x text-xl"></i>
        </button>
      </div>

      <div class="flex gap-4 items-start">
        <div class="h-36 w-24 shrink-0 rounded-xl overflow-hidden bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 shadow-2xs">
          <img id="detailCoverImg" src="" alt="Cover" class="h-full w-full object-cover hidden" />
          <i id="detailCoverDefault" class="ph ph-book text-3xl"></i>
        </div>

        <div class="min-w-0 flex-1">
          <h3 id="detailBookTitle" class="text-base font-extrabold text-slate-900 line-clamp-2 leading-snug">Judul Buku</h3>
          <p id="detailBookAuthor" class="text-xs text-slate-500 mt-1 font-medium">-</p>

          <div class="mt-3 space-y-1 text-xs">
            <p class="text-slate-500">Penerbit: <strong id="detailBookPublisher" class="text-slate-700 font-semibold">-</strong></p>
            <p class="text-slate-500">Tahun Terbit: <strong id="detailBookYear" class="text-slate-700 font-semibold">-</strong></p>
            <p class="text-slate-500">Lokasi Rak Fisik: <strong id="detailBookShelf" class="text-navy font-bold">-</strong></p>
            <p class="text-slate-500">Estimasi Nilai Buku: <strong id="detailBookPrice" class="text-slate-700 font-semibold">Rp 50.000</strong></p>
          </div>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
        <span class="text-slate-500">Status Stok:</span>
        <span id="detailBookStock" class="font-bold text-emerald-600">Tersedia</span>
      </div>
    </div>

    <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 flex items-center justify-end gap-2.5">
      <button id="btnDetailToBooking" type="button"
        class="w-full py-2.5 rounded-xl bg-navy text-white font-bold text-xs hover:bg-navy-light transition shadow-sm flex items-center justify-center gap-1.5">
        <i class="ph ph-bookmark-simple"></i>
        <span>Ajukan Pra-Pinjam Buku Ini</span>
      </button>
    </div>
  </div>
</div>
