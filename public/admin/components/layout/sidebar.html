<!--
  =============================================================================================
  CAKRAWALA DIGITAL LIBRARY - ADMIN SIDEBAR & MOBILE NAVIGATION
  File: public/admin/components/layout/sidebar.html
  =============================================================================================
-->

<!-- Mobile Top Bar with Menu Toggle -->
<header
  class="md:hidden flex items-center justify-between bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30">
  <div class="flex items-center gap-2.5">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-navy text-white shadow-sm">
      <i class="ph ph-shield-star text-xl" aria-hidden="true"></i>
    </div>
    <div>
      <span class="text-base font-extrabold tracking-tight text-navy">CAKRAWALA</span>
      <span class="block text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Admin Panel</span>
    </div>
  </div>
  <button id="btnToggleMobileSidebar" type="button" aria-label="Buka menu navigasi"
    class="flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-navy focus:outline-none focus:ring-2 focus:ring-navy">
    <i class="ph ph-list text-2xl" id="iconMobileSidebar"></i>
  </button>
</header>

<!-- Mobile Sidebar Backdrop Overlay -->
<div id="sidebarBackdrop"
  class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs hidden md:hidden transition-opacity duration-300"></div>

<!-- Left Sidebar Minimalis Kapsul (Independent Scroll) -->
<aside id="adminSidebar"
  class="fixed inset-y-0 left-0 z-50 flex w-64 md:w-68 flex-col justify-between border-r border-slate-200 bg-white p-4 shadow-sm transition-transform duration-300 -translate-x-full md:translate-x-0 md:static md:z-auto h-full overflow-y-auto shrink-0">
  <!-- Sidebar Top: Brand & Navigation -->
  <div>
    <!-- Brand Logo Badge -->
    <div class="flex items-center justify-between px-2 pb-6 pt-2 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-navy text-white shadow-md shadow-navy/20">
          <i class="ph ph-shield-star text-2xl" aria-hidden="true"></i>
        </div>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-navy">CAKRAWALA</h1>
          <p class="text-xs font-semibold text-slate-500">Pusat Kendali Admin</p>
        </div>
      </div>
      <button id="btnCloseMobileSidebar" type="button" aria-label="Tutup menu navigasi"
        class="md:hidden flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700">
        <i class="ph ph-x text-lg"></i>
      </button>
    </div>

    <!-- Navigation Section Label -->
    <div class="mt-6 px-2">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Manajemen Pengguna</p>
    </div>

    <!-- Navigation Menu Tabs -->
    <nav class="mt-3 space-y-1.5" aria-label="Navigasi Manajemen Pengguna">
      <!-- Tab Beranda (Dashboard Overview) -->
      <button type="button" id="tabBtnBeranda" data-tab="beranda"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 bg-navy text-white shadow-sm shadow-navy/20">
        <i class="ph ph-squares-four text-xl transition-transform group-hover:scale-110" aria-hidden="true"></i>
        <span class="flex-1 text-left">Beranda</span>
      </button>

      <!-- Tab Siswa -->
      <button type="button" id="tabBtnSiswa" data-tab="siswa"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-student text-xl transition-transform group-hover:scale-110" aria-hidden="true"></i>
        <span class="flex-1 text-left">Data Siswa</span>
      </button>

      <!-- Tab Guru -->
      <button type="button" id="tabBtnGuru" data-tab="guru"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-chalkboard-teacher text-xl transition-transform group-hover:scale-110" aria-hidden="true"></i>
        <span class="flex-1 text-left">Data Guru</span>
      </button>

      <!-- Tab Petugas -->
      <button type="button" id="tabBtnPetugas" data-tab="petugas"
        class="nav-tab-btn group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-navy">
        <i class="ph ph-user-gear text-xl transition-transform group-hover:scale-110" aria-hidden="true"></i>
        <span class="flex-1 text-left">Data Petugas</span>
      </button>
    </nav>
  </div>

  <!-- Sidebar Bottom: Super User Profile & Logout -->
  <div class="border-t border-slate-100 pt-4 space-y-2 mt-auto">
    <!-- Admin User Capsule (Penanda Role) -->
    <div 
      class="flex w-full items-center gap-3 rounded-xl bg-slate-50 p-2.5 border border-slate-200/70 shadow-2xs"
    >
      <div id="adminAvatarInitials" class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-slate-200 text-slate-400 shadow-2xs border border-slate-200/80">
        <i class="ph-fill ph-user text-base text-slate-400"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p id="adminUserName" class="truncate text-xs font-bold text-slate-800">Super Administrator</p>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="h-2 w-2 rounded-full bg-emerald-500 flex-shrink-0 animate-pulse"></span>
          <span class="text-[11px] font-medium text-slate-500">Admin &bull; Online</span>
        </div>
      </div>
    </div>

    <!-- Logout Button -->
    <button type="button" id="btnLogout"
      class="group flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-600 transition-all duration-200 hover:bg-rose-50 hover:text-rose-600 focus:outline-none focus:ring-2 focus:ring-rose-400">
      <i class="ph ph-sign-out text-xl transition-transform group-hover:-translate-x-0.5" aria-hidden="true"></i>
      <span>Keluar Sistem</span>
    </button>
  </div>
</aside>
