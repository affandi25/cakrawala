<!doctype html>
<!--
  =============================================================================================
  CAKRAWALA DIGITAL LIBRARY - PUSAT KENDALI ADMINISTRATOR (MODULAR MASTER LAYOUT)
  File: public/admin/dashboard.html & index.html
  
  STRUKTUR KOMPONEN MODULAR:
  - components/layout/sidebar.html        : Sidebar menu (Siswa, Guru, Petugas, Profil Admin, Logout)
  - components/layout/header.html         : Breadcrumb + KPI Card Ringkasan (Siswa, Guru, Petugas, Supabase)
  - components/layout/footer.html         : Info alert penghapusan cascade database & copyright
  - components/tabs/tab-siswa.html        : Search bar, tombol Tambah Siswa Baru, tabel Siswa (Aktif Default)
  - components/tabs/tab-guru.html         : Search bar, tombol Tambah Guru Baru, tabel Guru (Hidden)
  - components/tabs/tab-petugas.html      : Search bar, tombol Tambah Petugas Baru, tabel Petugas (Hidden)
  - components/modals/modal-form-user.html : Modal pop-up Tambah / Edit data pengguna
  - components/modals/modal-konfirmasi.html: Modal pop-up konfirmasi hapus pengguna & logout
  =============================================================================================
-->
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin | CAKRAWALA Digital Library</title>

  <!-- Tailwind CSS CDN & Custom Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#000C4F',
            'navy-light': '#0a1a7a',
            'navy-dark': '#000836'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.04)',
            'xs': '0 1px 3px 0 rgba(0, 0, 0, 0.07), 0 1px 2px 0 rgba(0, 0, 0, 0.04)'
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Stylesheet Khusus Dashboard Admin -->
  <link rel="stylesheet" href="../assets/css/dashboard-admin.css" />
</head>

<body class="bg-slate-50 font-sans text-slate-800 antialiased h-screen overflow-hidden flex flex-col md:flex-row selection:bg-navy selection:text-white">

  <!-- 1. Navigasi Sidebar Desktop & Mobile -->
  <include src="./components/layout/sidebar.html"></include>

  <!-- 2. Area Konten Utama Administrator (Independent Scroll Viewport) -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto">

    <!-- Top-Bar Header Dinamis & KPI Cards Ringkasan -->
    <include src="./components/layout/header.html"></include>

    <!-- Konten Utama Dashboard (Membungkus Tab Beranda & Tab Manajemen Pengguna) -->
    <main class="flex-1 px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8 pb-8 space-y-6 max-w-7xl w-full mx-auto">
      <!-- Tab 0: Beranda / Ringkasan Sistem (Aktif Default) -->
      <include src="./components/tabs/tab-beranda.html"></include>

      <!-- Tab 1: Manajemen Data Siswa (Hidden Default) -->
      <include src="./components/tabs/tab-siswa.html"></include>

      <!-- Tab 2: Manajemen Data Guru (Hidden Default) -->
      <include src="./components/tabs/tab-guru.html"></include>

      <!-- Tab 3: Manajemen Data Petugas (Hidden Default) -->
      <include src="./components/tabs/tab-petugas.html"></include>
    </main>

    <!-- Footer & Alert Info Penghapusan Cascade Database -->
    <include src="./components/layout/footer.html"></include>
  </div>

  <!-- 3. Jendela-Jendela Modal Dialog Terpusat -->
  <include src="./components/modals.html"></include>

  <!-- 4. Wadah Toast Notifikasi -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"
    aria-live="polite"></div>

  <!-- 5. Dependencies: Supabase JS Library, Client Config, & Admin Controller yang Aktif Berjalan -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../assets/js/supabaseClient.js"></script>
  <script type="module" src="admin.js"></script>
</body>

</html>
