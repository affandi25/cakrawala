<!-- MODAL: KONFIRMASI KELUAR DARI APLIKASI (LOGOUT SESI PETUGAS)                                -->
<!-- ============================================================================================= -->
<div id="modalLogout"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200"
  role="dialog" aria-modal="true">
  <div id="modalLogoutContent"
    class="w-full max-w-sm rounded-2xl bg-white shadow-2xl border border-slate-100 p-6 text-center space-y-4 transform scale-95 transition-transform duration-200">
    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-100 text-slate-600 mx-auto">
      <i class="ph-fill ph-sign-out text-2xl text-navy"></i>
    </div>
    <div>
      <h3 class="text-base font-extrabold text-slate-900">Keluar dari Sesi Petugas?</h3>
      <p class="text-xs text-slate-500 mt-1">
        Anda akan keluar dari meja sirkulasi dan harus masuk kembali untuk mengelola perpustakaan.
      </p>
    </div>
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button type="button" id="btnCancelLogout"
        class="rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:bg-slate-50 transition cursor-pointer">
        Batal
      </button>
      <button type="button" id="btnConfirmLogout"
        class="rounded-xl bg-navy py-2.5 text-xs font-bold text-white hover:bg-navy-light transition shadow-sm cursor-pointer">
        Ya, Keluar
      </button>
    </div>
  </div>
</div>
