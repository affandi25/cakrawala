<!-- ============================================================================================= -->
      <section id="tabContentInventaris" class="tab-content hidden space-y-6">

        <!-- BILAH KONTROL: Pencarian Live, Filter Kategori, Filter Status, & Tombol Tambah Buku -->
        <section
          class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
          <!-- Kotak Pencarian Live: Petugas mengetik judul buku atau penulis apa saja -->
          <div class="relative flex-1 max-w-md">
            <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-lg text-slate-400"
              aria-hidden="true"></i>
            <input type="search" id="inputSearchBooks"
              placeholder="Cari judul buku, penulis, penerbit, atau ID buku..."
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 py-2.5 pl-10 pr-10 text-sm text-slate-900 placeholder:text-slate-400 outline-none transition-all duration-200 focus:border-navy focus:bg-white focus:ring-3 focus:ring-navy/10" />
            <!-- Tombol silang untuk mengosongkan kata kunci pencarian -->
            <button type="button" id="btnClearSearchBooks" aria-label="Bersihkan pencarian"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 hidden text-base">
              <i class="ph ph-x-circle-fill"></i>
            </button>
          </div>

          <!-- Opsi Penyaring (Filter) & Tombol Aksi -->
          <div class="flex flex-wrap items-center gap-3">
            <!-- Dropdown Pilihan Kategori: Diisi otomatis oleh JavaScript dari tabel 'kategori_buku' -->
            <select id="selectFilterKategori"
              class="rounded-xl border border-slate-200 bg-white py-2 px-3 text-xs font-semibold text-slate-700 outline-none transition focus:border-navy">
              <option value="">Semua Kategori</option>
            </select>

            <!-- Dropdown Pilihan Status Buku: Menampilkan hanya yang masih 'Tersedia' atau 'Dipinjam' -->
            <select id="selectFilterStatusBuku"
              class="rounded-xl border border-slate-200 bg-white py-2 px-3 text-xs font-semibold text-slate-700 outline-none transition focus:border-navy">
              <option value="">Semua Status</option>
              <option value="Tersedia">Tersedia</option>
              <option value="Dipinjam">Dipinjam</option>
            </select>

            <!-- Tombol Refresh: Mengunduh ulang katalog buku terbaru dari cloud Supabase -->
            <button type="button" id="btnRefreshBooks" title="Muat ulang buku"
              class="flex items-center justify-center h-10 w-10 rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-navy focus:outline-none focus:ring-2 focus:ring-navy transition-colors">
              <i class="ph ph-arrows-clockwise text-lg"></i>
            </button>

            <!-- Tombol Membuka Modal Formulir Tambah Buku Baru -->
            <button type="button" id="btnOpenAddBookModal"
              class="inline-flex items-center justify-center gap-2 rounded-xl bg-navy px-4 py-2.5 text-sm font-bold text-white shadow-sm shadow-navy/25 transition-all duration-200 hover:bg-navy-light focus:outline-none focus:ring-3 focus:ring-navy/30">
              <i class="ph ph-plus-circle text-lg" aria-hidden="true"></i>
              <span>Tambah Buku Baru</span>
            </button>
          </div>
        </section>

        <!-- TABEL KATALOG INVENTARIS BUKU -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/50">
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-bold text-slate-800">Koleksi Inventaris Buku Fisik</h3>
              <!-- Lencana Penghitung Total Judul Buku -->
              <span id="booksRecordCount"
                class="rounded-md bg-slate-200/80 px-2 py-0.5 text-xs font-bold text-slate-700">0 Buku</span>
            </div>
            <span class="text-xs text-slate-400">Sinkronisasi Realtime dengan Supabase</span>
          </div>

          <div class="overflow-x-auto min-h-[320px]">
            <table class="w-full text-left text-sm border-collapse">
              <thead class="bg-slate-50 text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-slate-200">
                <tr>
                  <th class="px-5 py-3.5">Cover & ID</th>
                  <th class="px-5 py-3.5">Judul Buku & Penulis</th>
                  <th class="px-5 py-3.5">Kategori & Rak Fisik</th>
                  <th class="px-5 py-3.5">Stok & Status</th>
                  <th class="px-5 py-3.5">Harga Penggantian</th>
                  <th class="px-5 py-3.5 text-right">Aksi</th>
                </tr>
              </thead>
              <!-- Baris-baris buku akan disuntikkan secara dinamis oleh function renderBooksTable() di petugas.js -->
              <tbody id="tableBooksBody" class="divide-y divide-slate-100 text-slate-700">
                <!-- Diisi otomatis oleh JavaScript -->
              </tbody>
            </table>
          </div>

          <!-- Kaki Tabel: Informasi Jumlah Baris yang Sedang Tampil -->
          <div class="px-6 py-3 border-t border-slate-100 bg-slate-50/30 flex items-center justify-between text-xs text-slate-500">
            <div class="flex items-center gap-1.5">
              <i class="ph ph-info text-sm text-navy" aria-hidden="true"></i>
              <span id="booksTableInfo">Menampilkan data buku koleksi perpustakaan.</span>
            </div>
          </div>
        </section>

      </section>
