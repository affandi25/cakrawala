<!doctype html>
<!--
  =============================================================================================
  CAKRAWALA DIGITAL LIBRARY - DASHBOARD PETUGAS SIRKULASI (MODULAR)
  File: dashboard.html
  
  STRUKTUR MODULAR:
  - components/sidebar.html          : Sidebar navigasi desktop & bilah menu mobile
  - components/header.html           : Papan atas judul meja kerja & breadcrumb
  - components/tab-overview.html     : Meja 1 - Statistik, ringkasan, dan kartu metrik
  - components/tab-sirkulasi.html    : Meja 2 - Antrean prapinjam daring & peminjaman walk-in
  - components/tab-pengembalian.html : Meja 3 - Pengembalian buku & kasir pelunasan denda
  - components/tab-inventaris.html   : Meja 4 - Katalog buku induk & cetak stiker QR
  - components/tab-pengumuman.html   : Meja 5 - Manajemen pengumuman & poster event
  - components/modals.html           : 10 Jendela pop-up modal dialog
  =============================================================================================
-->
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Petugas Sirkulasi | CAKRAWALA Digital Library</title>

  <!-- Tailwind CSS CDN & Konfigurasi Tema -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#000C4F',
            'navy-light': '#0a1a7a',
            'navy-dark': '#000836'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- QRCode.js Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- jsQR Decoder untuk file upload gambar barcode/QR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <!-- HTML5-QRCode Scanner Kamera -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Stylesheet Khusus Dashboard Petugas -->
  <link rel="stylesheet" href="../assets/css/dashboard-petugas.css" />
</head>

<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col md:flex-row selection:bg-navy selection:text-white">

  <!-- Navigasi Sidebar & Header Mobile -->
  <include src="./components/sidebar.html" />

  <!-- Area Konten Utama (Ruang Kerja di Sebelah Kanan) -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Header Atas Dinamis: Judul Meja Kerja & Breadcrumb -->
    <include src="./components/header.html" />

    <!-- Ruang Kerja (Main): Berisi 5 Meja Kerja -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl w-full mx-auto">
      <!-- Meja 1: Overview / Ringkasan Operasional -->
      <include src="./components/tab-overview.html" />

      <!-- Meja 2: Sirkulasi Peminjaman & Prapinjam -->
      <include src="./components/tab-sirkulasi.html" />

      <!-- Meja 3: Pengembalian Buku & Denda -->
      <include src="./components/tab-pengembalian.html" />

      <!-- Meja 4: Inventaris & Katalog Buku -->
      <include src="./components/tab-inventaris.html" />

      <!-- Meja 5: Kelola Pengumuman & Poster Event -->
      <include src="./components/tab-pengumuman.html" />
    </main>
  </div>

  <!-- Jendela-Jendela Modal Pop-up Tersembunyi -->
  <include src="./components/modals.html" />

  <!-- Wadah Pemberitahuan Mengambang (Toast Notification) -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full" aria-live="polite"></div>

  <!-- Koneksi Skrip Utama -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../assets/js/supabaseClient.js"></script>
  <script type="module" src="petugas.js"></script>
</body>

</html>
